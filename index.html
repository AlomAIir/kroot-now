<style>
/* Site font: The Year of Handicrafts (خط عام الحرف اليدوية) by Ahmed Zaza / iwantype.com, served from fonts/.
   Arabic only (no Latin letters), so Latin words fall back to the system fonts listed after it in --f-sans. */
@font-face { font-family: "Year of Handicrafts"; src: url("fonts/handicrafts-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Year of Handicrafts"; src: url("fonts/handicrafts-600.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
@font-face { font-family: "Year of Handicrafts"; src: url("fonts/handicrafts-700.woff2") format("woff2"); font-weight: 700 900; font-display: swap; }
:root {
  /* Layout: Apple-style full-bleed bands (white, light gray, black) around a centered 1024px column; app steps show the live card on a gray "product stage" */
  --bg: #ffffff;
  --band: #f5f5f7;
  --band-hover: #e8e8ed;
  --tile: #ffffff;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #d2d2d7;
  --nav-bg: rgba(255, 255, 255, .78);
  --nav-line: rgba(0, 0, 0, .08);
  --accent: #6e4fc2;
  --accent-hover: #5c3fb0;
  --accent-ink: #ffffff;
  --accent-soft: #f1ecfb;
  --accent-text: #6e4fc2;
  --lilac: #b49be8;
  --gold: #b0864a;
  --sage: #6f8f6b;
  --bad: #c9372c;
  --good: #1f8a4c;
  --stage: #f5f5f7;
  --night: #000000;
  --night-ink: #f5f5f7;
  --night-muted: #a1a1a6;
  --night-tile: #1d1d1f;
  --night-tile-hover: #2c2c2e;
  --night-line: #424245;
  --apple-bg: #000000;
  --apple-fg: #ffffff;
  --apple-edge: #000000;
  --wa: #1d7f48;
  --on-wa: #ffffff;
  --scrim: rgba(0, 0, 0, .78);
  --toast-bg: rgba(29, 29, 31, .92);
  --toast-ink: #f5f5f7;
  --shadow-card: 0 34px 60px -18px rgba(28, 18, 60, .32), 0 14px 26px -14px rgba(28, 18, 60, .2);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .06);
  --glass: rgba(255, 255, 255, .58);
  --glass-line: rgba(0, 0, 0, .08);
  --glass-hi: rgba(255, 255, 255, .7);
  --glass-tile: rgba(255, 255, 255, .62);
  --glass-tile-hover: rgba(255, 255, 255, .85);
  --glass-strong: rgba(250, 250, 252, .95);
  --f-sans: "Year of Handicrafts", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --ease: cubic-bezier(.25, .1, .25, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --fwd: 1; /* flips to -1 in RTL so "forward" always slides from the reading direction */
}
[dir="rtl"] { --fwd: -1; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --band: #0d0d0e; --band-hover: #232326; --tile: #1d1d1f; --ink: #f5f5f7; --muted: #a1a1a6; --line: #424245;
    --nav-bg: rgba(22, 22, 23, .78); --nav-line: rgba(255, 255, 255, .1);
    --accent: #7c5ce6; --accent-hover: #8d70ee; --accent-ink: #ffffff; --accent-soft: #241a3d; --accent-text: #b9a3f5; --lilac: #cdb8ff;
    --gold: #d6b07a; --sage: #93b28e; --bad: #ff6b5e; --good: #4cd281; --stage: #1d1d1f;
    --apple-edge: #424245; --scrim: rgba(0, 0, 0, .86); --toast-bg: rgba(245, 245, 247, .94); --toast-ink: #1d1d1f;
    --shadow-card: 0 34px 60px -18px rgba(0, 0, 0, .8), 0 14px 26px -14px rgba(0, 0, 0, .6); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .4);
    --glass: rgba(29, 29, 31, .52); --glass-line: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .08);
    --glass-tile: rgba(44, 44, 48, .5); --glass-tile-hover: rgba(58, 58, 63, .62); --glass-strong: rgba(28, 28, 30, .95);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --band: #0d0d0e; --band-hover: #232326; --tile: #1d1d1f; --ink: #f5f5f7; --muted: #a1a1a6; --line: #424245;
  --nav-bg: rgba(22, 22, 23, .78); --nav-line: rgba(255, 255, 255, .1);
  --accent: #7c5ce6; --accent-hover: #8d70ee; --accent-ink: #ffffff; --accent-soft: #241a3d; --accent-text: #b9a3f5; --lilac: #cdb8ff;
  --gold: #d6b07a; --sage: #93b28e; --bad: #ff6b5e; --good: #4cd281; --stage: #1d1d1f;
  --apple-edge: #424245; --scrim: rgba(0, 0, 0, .86); --toast-bg: rgba(245, 245, 247, .94); --toast-ink: #1d1d1f;
  --shadow-card: 0 34px 60px -18px rgba(0, 0, 0, .8), 0 14px 26px -14px rgba(0, 0, 0, .6); --shadow-sm: 0 4px 14px rgba(0, 0, 0, .4);
  --glass: rgba(29, 29, 31, .52); --glass-line: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .08);
  --glass-tile: rgba(44, 44, 48, .5); --glass-tile-hover: rgba(58, 58, 63, .62); --glass-strong: rgba(28, 28, 30, .95);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-sans); font-size: 19px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap {
  width: 100%; max-width: 1024px; margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.app { min-height: 100%; display: flex; flex-direction: column; }
.demo {
  margin: 0; text-align: center; font-size: 12px; color: var(--muted); background: var(--band); padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* global nav */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--nav-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--nav-line);
}
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; }
.top-start { display: flex; align-items: center; gap: 2px; min-width: 0; }
.top-actions { display: flex; align-items: center; gap: 2px; flex: none; }
.brand {
  appearance: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 0 2px;
  line-height: 0; color: var(--ink);
}
.brand .mark { width: 28px; height: 28px; flex: none; color: var(--accent); transition: transform .6s var(--ease-out); }
/* wordmark: Marhey lettering drawn as paths, with the damma painted in the accent colour */
.wordmark { display: block; height: 27px; width: auto; overflow: visible; }
.kn-ink { fill: var(--ink); }
.kn-damma { fill: var(--accent); }
.brand:hover .mark { transform: rotate(-10deg); }
.back { display: inline-flex; align-items: center; gap: 2px; appearance: none; border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--accent-text); min-height: 44px; padding: 0 6px 0 0; }
.back svg { width: 20px; height: 20px; }
[dir="rtl"] .flip { transform: scaleX(-1); }
@media (max-width: 480px) { .back:not([hidden]) + .brand #brandText { display: none; } }
.nav-link { appearance: none; border: 0; background: none; cursor: pointer; color: var(--ink); opacity: .82; font-size: 14px; min-height: 44px; padding: 0 9px; transition: opacity .2s; }
.nav-link:hover { opacity: 1; }
.nav-cta { appearance: none; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; border-radius: 980px; padding: 5px 14px; min-height: 30px; margin-inline-start: 4px; transition: background-color .2s; }
.nav-cta:hover { background: var(--accent-hover); }

/* progress: a floating liquid-glass capsule that stays with you; visited steps are buttons */
.prog { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 15; padding-block: 10px 2px; pointer-events: none; }
.pbar {
  pointer-events: auto; display: flex; align-items: center; gap: 2px;
  width: fit-content; max-width: 100%; margin-inline: auto; padding: 5px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
  overflow-x: auto; scrollbar-width: none;
}
.pbar::-webkit-scrollbar { display: none; }
.pstep {
  appearance: none; border: 0; background: none; cursor: pointer; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 6px; padding: 4px; padding-inline-end: 10px; border-radius: 999px;
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted);
  transition: background .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease);
}
.pstep:disabled { cursor: default; opacity: .45; }
.pstep.is-done:not(.is-cur):hover { background: var(--band-hover); color: var(--ink); }
.pstep.is-cur { cursor: default; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px -3px rgba(80, 50, 170, .55); }
.pstep-dot {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; flex: none;
  font-size: 11px; font-weight: 700; background: var(--band); color: var(--muted);
  transition: background .3s var(--ease), color .3s var(--ease);
}
.pstep.is-done .pstep-dot { background: var(--accent-soft); color: var(--accent-text); }
.pstep.is-cur .pstep-dot { background: rgba(255, 255, 255, .26); color: var(--accent-ink); }
.pstep-name { white-space: nowrap; }

main { flex: 1; outline: none; overflow-x: clip; }
#screen > .wrap.step { padding-block: 22px 44px; }
#screen.enter > * { animation: stepIn .55s var(--ease-out) both; }
#screen.enter.rev > * { animation-name: stepBack; }
h1 { font-size: clamp(30px, 7vw, 44px); font-weight: 700; line-height: 1.22; margin: 0 0 8px; text-wrap: balance; }
html[lang="en"] h1, html[lang="en"] .big { letter-spacing: -.02em; }
.display { font-size: clamp(34px, 8vw, 52px); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 18px; font-size: 19px; }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.stack { display: grid; gap: 12px; }

/* buttons */
.btn {
  appearance: none; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 14px 30px; border-radius: 980px; font-size: 18px; font-weight: 600;
  cursor: pointer; width: 100%; text-decoration: none; text-align: center;
  transition: background-color .25s var(--ease), transform .25s var(--ease), opacity .2s;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--band); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { background: var(--band-hover); }
.btn-ghost { background: transparent; color: var(--accent-text); border: 1px solid var(--line); min-height: 52px; font-size: 17px; }
.btn-apple { background: var(--apple-bg); color: var(--apple-fg); border: 1px solid var(--apple-edge); }
.btn-apple b { font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif; font-weight: 600; }
/* Where Apple Pay works, WebKit draws Apple's own button (logo and wording, in the page language) */
@supports (-webkit-appearance: -apple-pay-button) {
  .apple-native { -webkit-appearance: -apple-pay-button; -apple-pay-button-type: buy; -apple-pay-button-style: black; padding: 0; border: 0; }
  .apple-native > * { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .apple-native { -apple-pay-button-style: white; } }
  :root[data-theme="dark"] .apple-native { -apple-pay-button-style: white; }
}
.btn-wa { background: var(--wa); color: var(--on-wa); }
.btn svg { width: 22px; height: 22px; flex: none; }
.link-arrow {
  appearance: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  color: var(--accent-text); font-size: 19px; min-height: 44px; padding: 0 4px;
}
.link-arrow:hover { text-decoration: underline; text-underline-offset: 4px; }
.chev { width: 16px; height: 16px; flex: none; transition: transform .3s var(--ease-out); }
[dir="rtl"] .link-arrow .chev { transform: scaleX(-1); }
.link-arrow:hover .chev { transform: translateX(3px); }
[dir="rtl"] .link-arrow:hover .chev { transform: scaleX(-1) translateX(3px); }
.bar {
  position: sticky; bottom: 0; z-index: 10; margin-top: auto;
  background: var(--nav-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--nav-line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-in { display: flex; justify-content: flex-end; }

/* ---------- AI assistant (liquid glass) ---------- */
.asst-btn {
  position: fixed; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 18px; z-index: 30;
  appearance: none; border: 1px solid var(--glass-line); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 999px;
  background: var(--glass); color: var(--accent-text); font-weight: 700; font-size: 14px;
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
  transition: transform .25s var(--ease-out);
}
.asst-btn:hover { transform: translateY(-2px); }
.asst-btn svg { width: 18px; height: 18px; color: var(--gold); }
.asst-panel {
  position: fixed; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 18px; z-index: 31;
  width: 380px; max-height: min(560px, 72vh);
  display: flex; flex-direction: column; border-radius: 24px; overflow: hidden;
  background: var(--glass-strong); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: saturate(200%) blur(28px); backdrop-filter: saturate(200%) blur(28px);
  box-shadow: var(--shadow-card), inset 0 1px 0 var(--glass-hi);
  animation: asstIn .4s var(--ease-out);
}
@keyframes asstIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
@media (max-width: 600px) {
  .asst-panel { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-height: 70vh; }
  body.asst-open .bar { visibility: hidden; }
}
.asst-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--glass-line); }
.asst-x { appearance: none; border: 0; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--band); color: var(--muted); font-size: 15px; line-height: 1; }
.asst-msgs { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 8px; align-content: start; min-height: 170px; }
.asst-m { max-width: 86%; padding: 9px 13px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; }
.asst-m.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-end-end-radius: 6px; }
.asst-m.bot { justify-self: start; background: var(--tile); color: var(--ink); border: 1px solid var(--line); border-end-start-radius: 6px; }
.asst-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--glass-line); }
.asst-form input { flex: 1; min-width: 0; appearance: none; border: 1px solid var(--line); border-radius: 999px; background: var(--tile); padding: 9px 14px; font-size: 15px; }
.asst-send { appearance: none; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; padding: 0 16px; cursor: pointer; transition: background-color .2s; }
.asst-send:hover { background: var(--accent-hover); }
.asst-send:disabled { opacity: .5; }

/* ---------- home ---------- */
.band { padding-block: 84px; }
.band.gray { background: var(--band); }
.band.night { background: var(--night); color: var(--night-ink); }
.center { text-align: center; }
.eyebrow { margin: 0 0 10px; font-size: 19px; font-weight: 600; color: var(--accent-text); }
.night .eyebrow { color: var(--lilac); }
.big { font-size: clamp(34px, 8vw, 64px); font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; }
html[lang="ar"] .big { line-height: 1.3; }
.hl { background: linear-gradient(95deg, var(--accent) 0%, var(--lilac) 70%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sub { font-size: clamp(19px, 2.6vw, 24px); color: var(--muted); margin: 16px auto 0; line-height: 1.5; max-width: 34ch; text-wrap: balance; }
.reveal { transform: translateY(44px); transition: transform 1.2s var(--ease-out); }
.reveal.in { transform: none; }

/* the header already carries the logo, so the hero opens on the headline and gets a whole card on a phone's first screen */
.hero { padding-block: 36px 0; text-align: center; overflow: hidden; }
.hero .big { font-size: clamp(36px, 8.8vw, 76px); max-width: 15ch; margin-inline: auto; animation: rise 1s var(--ease-out) both; }
.hero .sub { animation: rise 1s .08s var(--ease-out) both; }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 24px; margin-top: 30px; }
.hero-actions .btn { width: auto; min-width: 210px; }
.hero .hero-actions { animation: rise 1s .14s var(--ease-out) both; }
.from { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
.hero-stage { --q: .3; position: relative; height: clamp(400px, 112vw, 640px); margin-top: clamp(28px, 4vw, 44px); }
.hc { position: absolute; top: 0; left: 50%; width: clamp(196px, 54vw, 310px); aspect-ratio: 9 / 16; margin-left: calc(clamp(196px, 54vw, 310px) / -2); }
.hc.side {
  width: clamp(172px, 47vw, 272px); margin-left: calc(clamp(172px, 47vw, 272px) / -2); top: 34px;
  transform-origin: 50% 90%;
  transform: translateX(calc(var(--side) * var(--q) * 66%)) rotate(calc(var(--side) * var(--q) * 9deg));
}
.hc.front { z-index: 2; transform: scale(calc(1 + var(--q) * .025)); transform-origin: 50% 100%; }
.hc-in { width: 100%; height: 100%; animation: heroIn 1.4s var(--ease-out) both; animation-delay: calc(.2s + var(--i) * .12s); }
.hc canvas { display: block; width: 100%; height: 100%; border-radius: 16px; box-shadow: var(--shadow-card); background: var(--stage); }

.demo-grid { display: grid; gap: 30px; align-items: center; margin-top: 40px; }
/* card first, input under it: on a phone the keyboard covers the bottom of the screen, so the card has to sit above what's being typed */
.demo-field { order: 2; display: grid; gap: 12px; text-align: center; max-width: 440px; width: 100%; margin-inline: auto; }
.demo-field input {
  width: 100%; height: 66px; border-radius: 18px; border: 1px solid var(--line); background: var(--tile); color: var(--ink);
  font-size: 26px; font-weight: 600; text-align: center; padding: 0 20px; transition: border-color .2s, box-shadow .2s;
}
.demo-field input::placeholder { color: var(--muted); font-weight: 400; font-size: 21px; }
.demo-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.demo-card { justify-self: center; width: clamp(200px, 54vw, 330px); scroll-margin-top: calc(66px + env(safe-area-inset-top, 0px)); }
.demo-card canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 16px; box-shadow: var(--shadow-card); background: var(--stage); }

.bento { display: grid; gap: 16px; margin-top: 44px; }
.tile {
  position: relative; overflow: hidden; display: grid; gap: 8px; align-content: start; min-width: 0;
  background: var(--band); border-radius: 30px; padding: 32px 26px 28px;
}
.band.gray .tile { background: var(--tile); }
.tile h3 { margin: 0; font-size: clamp(24px, 3.3vw, 30px); line-height: 1.25; font-weight: 700; text-wrap: balance; }
.tile p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
.tile.dark { background: var(--night); color: var(--night-ink); }
.tile.dark p { color: var(--night-muted); }
.tile-visual { margin-top: 18px; display: grid; place-items: center; gap: 10px; min-height: 120px; }
.tile-split { display: grid; gap: 22px; align-items: center; }
.spell { display: grid; gap: 10px; width: 100%; }
.spell-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border-radius: 18px; background: var(--tile); }
.band .tile .spell-row { background: var(--bg); }
.spell-word { font-family: "Aref Ruqaa", "Amiri", serif; font-weight: 700; font-size: 44px; line-height: 1.4; }
.bad .spell-word { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 3px; }
.spell-tag { font-size: 15px; font-weight: 600; white-space: nowrap; }
.bad .spell-tag { color: var(--bad); }
.good .spell-tag { color: var(--good); }
.glyph-box { min-height: 190px; }
.glyph { font-family: "Aref Ruqaa", "Amiri", serif; font-weight: 700; font-size: 128px; line-height: 1.15; color: var(--accent-text); }
.glyph.swap { animation: glyphIn .6s var(--ease-out); }
.glyph-name { font-size: 13px; color: var(--muted); direction: ltr; }
.dates { display: grid; gap: 4px; text-align: center; }
.dates .g { font-size: 21px; color: var(--muted); }
.dates .arrow { color: var(--accent-text); font-size: 22px; }
.dates .h { font-size: 28px; font-weight: 700; }
.pay-mark { font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif; font-size: 50px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.pay-sub { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pay-chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--night-line); font-size: 14px; color: var(--night-ink); }
.qr-tile { width: 140px; height: 140px; border-radius: 14px; box-shadow: var(--shadow-sm); }
.pv { display: flex; align-items: center; justify-content: center; gap: 16px; }
.pv figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
.pv canvas { width: min(34vw, 170px); height: auto; aspect-ratio: 9 / 16; border-radius: 12px; box-shadow: var(--shadow-card); background: var(--stage); }
.pv figcaption { font-size: 14px; font-weight: 600; color: var(--muted); }
.pv .arr { font-size: 26px; color: var(--accent-text); }

.gal-filters { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px; margin-top: 30px; scrollbar-width: none; }
.gal-filters::-webkit-scrollbar { display: none; }
.gal-pill {
  appearance: none; cursor: pointer; flex: none; border: 1px solid var(--night-line); background: transparent; color: var(--night-ink);
  border-radius: 999px; padding: 8px 18px; font-size: 16px; min-height: 44px; transition: background-color .25s, color .25s, border-color .25s;
}
.gal-pill:hover { border-color: var(--night-ink); }
.gal-pill[aria-pressed="true"] { background: var(--night-ink); color: var(--night); border-color: var(--night-ink); }
.gal-row { display: flex; gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block: 34px 10px; overscroll-behavior-x: contain; scrollbar-width: none; min-width: 0; }
.gal-row::-webkit-scrollbar { display: none; }
.g-tile {
  flex: 0 0 clamp(220px, 62vw, 290px); scroll-snap-align: center; appearance: none; border: 0; background: none; cursor: pointer;
  display: grid; gap: 4px; padding: 0; color: var(--night-ink); text-align: center;
}
.g-tile canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 18px; background: var(--night-tile); margin-bottom: 14px; box-shadow: 0 24px 50px -10px rgba(0, 0, 0, .7); transition: transform .5s var(--ease-out); }
.g-tile:hover canvas, .g-tile:focus-visible canvas { transform: translateY(-8px); }
.g-name { font-size: 19px; font-weight: 600; }
.g-occ { font-size: 14px; color: var(--night-muted); }
.paddles { display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; }
.paddle { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--night-tile); color: var(--night-ink); cursor: pointer; display: grid; place-items: center; transition: background-color .2s; }
.paddle:hover { background: var(--night-tile-hover); }
.paddle .chev { width: 18px; height: 18px; }
.flip-x .chev { transform: scaleX(-1); }
[dir="rtl"] .paddle .chev { transform: scaleX(-1); }
[dir="rtl"] .paddle .flip-x .chev { transform: none; }
.flip-x { display: grid; }

.steps { list-style: none; margin: 44px 0 0; padding: 0; display: grid; gap: 34px; }
.step { display: grid; gap: 6px; }
.step-num { font-size: 76px; font-weight: 700; line-height: 1; background: linear-gradient(160deg, var(--accent), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.step h3 { margin: 8px 0 0; font-size: 28px; }
.step p { margin: 0; color: var(--muted); font-size: 18px; }
.band.final { padding-block: 100px; }
.foot { background: var(--band); padding-block: 22px 40px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.foot p { margin: 0; }
.foot hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* ---------- app steps ---------- */
/* occasion deck: three panels (category → type → eid) sliding horizontally, swipeable */
.crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; min-height: 38px; }
.crumb {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--tile); color: var(--muted);
  border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 600; min-height: 36px;
  transition: border-color .2s, color .2s, background-color .2s; animation: rise .4s var(--ease-out) both;
}
.crumb[aria-current="step"] { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.crumb-sep { color: var(--muted); display: inline-flex; }
.crumb-sep .chev { width: 14px; height: 14px; }
[dir="rtl"] .crumb-sep .chev { transform: scaleX(-1); }
.deck { overflow: hidden; margin-top: 6px; touch-action: pan-y; }
.deck-track { display: flex; align-items: flex-start; transition: transform .55s var(--ease-out); }
.deck-track.drag { transition: none; }
.panel { flex: 0 0 100%; min-width: 0; padding: 4px 2px 10px; }
.panel-title { font-size: clamp(22px, 5vw, 28px); font-weight: 700; margin: 10px 0 4px; }
.cat-grid { display: grid; gap: 14px; margin-top: 16px; }
.cat {
  appearance: none; cursor: pointer; text-align: start; display: flex; align-items: center; gap: 18px;
  padding: 20px 20px; border-radius: 26px; border: 1px solid var(--line); background: var(--tile); color: var(--ink);
  transition: border-color .2s, transform .5s var(--ease-out), box-shadow .25s;
  animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms);
}
.cat:hover { border-color: var(--muted); transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.cat[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cat .medal {
  width: 72px; height: 72px; flex: none; border-radius: 24px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--tint, var(--accent)) 13%, transparent); color: var(--tint, var(--accent-text));
  transition: transform .5s var(--ease-out);
}
.cat:hover .medal { transform: scale(1.07) rotate(-4deg); }
.cat .medal svg { width: 40px; height: 40px; }
.cat-txt { display: grid; gap: 3px; min-width: 0; }
.cat-name { font-size: 22px; font-weight: 700; line-height: 1.25; }
.cat-subs { color: var(--muted); font-size: 15px; line-height: 1.4; }
.cat > .chev { margin-inline-start: auto; width: 20px; height: 20px; color: var(--muted); flex: none; }
[dir="rtl"] .cat > .chev { transform: scaleX(-1); }
.cat-wedding { --tint: var(--gold); }
.cat-newborn { --tint: var(--lilac); }
.cat-events { --tint: var(--sage); }
.occ-sub { font-size: 13px; font-weight: 400; color: var(--muted); line-height: 1.35; margin-top: -4px; }
.deck-hint { text-align: center; margin-top: 10px; }
.grid-occ { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.occ {
  appearance: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  min-height: 140px; padding: 16px 10px; background: var(--tile); border: 1px solid var(--line); border-radius: 18px;
  font-size: 19px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.3;
  transition: border-color .2s, box-shadow .2s; animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 50ms);
}
.occ svg { width: 44px; height: 44px; color: var(--accent-text); }
.occ:hover { border-color: var(--muted); }
.occ[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); animation: pick .45s var(--ease-out); }
.badge { position: absolute; top: 24px; inset-inline-start: 22px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.field { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field label, .field legend, .choices legend { font-weight: 600; font-size: 15px; padding: 0; color: var(--ink); }
.opt { font-weight: 400; color: var(--muted); }
.field input, .field textarea {
  width: 100%; min-height: 58px; padding: 14px 16px; font-size: 19px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--tile); color: var(--ink); transition: border-color .2s, box-shadow .2s;
}
.field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field input.invalid { border-color: var(--bad); box-shadow: 0 0 0 4px var(--accent-soft); animation: nudge .4s var(--ease); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .7; }
.field input[type="date"], .field input[type="time"] { min-height: 60px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 16px; border-radius: 14px; background: var(--tile); border: 1px solid var(--line); font-size: 17px; line-height: 1.5; transition: border-color .2s, box-shadow .2s; }
.check input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); margin: 1px 0 0; }
.check:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { appearance: none; cursor: pointer; min-height: 46px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--tile); font-size: 16px; color: var(--ink); transition: border-color .2s, background-color .2s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.choices { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--tile); cursor: pointer; font-size: 18px; line-height: 1.5; transition: border-color .2s, box-shadow .2s; }
.choice:hover { border-color: var(--muted); }
.choice input { width: 22px; height: 22px; accent-color: var(--accent); margin: 3px 0 0; flex: none; }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice .tag { display: inline-block; margin-inline-start: 8px; font-size: 12px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; vertical-align: 2px; }
.more summary { cursor: pointer; list-style: none; color: var(--accent-text); min-height: 44px; display: flex; align-items: center; gap: 6px; padding-inline: 2px; font-size: 17px; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "+"; font-weight: 600; transition: transform .3s var(--ease-out); }
.more[open] summary::after { transform: rotate(45deg); }
.more .choices { margin-top: 6px; animation: rise .4s var(--ease-out) both; }
.btn-ghost svg { width: 20px; height: 20px; color: var(--gold); }
.status { min-height: 1.2em; }
.facts { margin: 0; display: grid; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.fact dt { grid-column: 1; color: var(--muted); font-size: 14px; }
.fact dd { grid-column: 1; margin: 0; font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.fact .link { grid-column: 2; grid-row: 1 / span 2; align-self: center; appearance: none; border: 0; background: none; color: var(--accent-text); font-size: 16px; cursor: pointer; min-height: 44px; padding: 0 6px; }
.drop { display: grid; place-items: center; gap: 10px; min-height: 220px; padding: 18px; border: 1.5px dashed var(--line); border-radius: 24px; background: var(--band); cursor: pointer; text-align: center; font-weight: 600; font-size: 19px; transition: border-color .2s; }
.drop:hover { border-color: var(--accent); }
.drop svg { width: 48px; height: 48px; color: var(--accent-text); }
.drop img { max-height: 46vh; width: auto; max-width: 100%; border-radius: 12px; box-shadow: var(--shadow-card); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.read-result { display: grid; gap: 8px; margin-block: 14px; }
.read-card { background: var(--band); border-radius: 18px; padding: 16px; display: grid; gap: 6px; animation: rise .5s var(--ease-out) both; }
.read-card h2 { margin: 0; font-size: 18px; color: var(--accent-text); }
.read-card p { margin: 0; }
.busy { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; }
.busy .spin { width: 22px; height: 22px; border-width: 3px; border-color: var(--line); border-top-color: var(--accent); }
.pay { display: grid; gap: 16px; max-width: 520px; margin-inline: auto; width: 100%; }
.pay-or { display: flex; align-items: center; gap: 12px; margin: 0; color: var(--muted); font-size: 14px; }
.pay-or::before, .pay-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tap-card { min-height: 64px; }
.apple-box { display: grid; }
.apple-box #apple-pay-button:empty { display: none; }
.order { display: flex; gap: 16px; align-items: center; background: var(--band); border-radius: 20px; padding: 14px; }
.order canvas { width: 84px; height: auto; aspect-ratio: 9 / 16; border-radius: 8px; flex: none; background: var(--tile); box-shadow: var(--shadow-sm); }
.order-name { margin: 0; font-weight: 700; font-size: 19px; }
.includes { margin: 6px 0 0; padding-inline-start: 20px; font-size: 15px; color: var(--muted); }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); font-size: 19px; font-weight: 600; }
.total strong { font-size: 30px; font-variant-numeric: tabular-nums; }
.demo-note { margin: 0; text-align: center; font-weight: 600; color: var(--accent-text); font-size: 15px; }
.done { display: grid; gap: 10px; text-align: center; max-width: 520px; margin-inline: auto; width: 100%; }
.final-wrap { position: relative; width: min(100%, 340px); margin: 14px auto 16px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-card); animation: reveal 1.1s var(--ease-out) both; }
.final-wrap::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%); transform: translateX(-120%); animation: shine 1.6s .6s var(--ease-out) both; pointer-events: none; }
.final { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; background: var(--stage); }

/* overlays */
.toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%);
  background: var(--toast-bg); color: var(--toast-ink); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 16px; width: max-content; max-width: calc(100% - 32px); text-align: center;
  box-shadow: var(--shadow-sm); animation: toastIn .4s var(--ease-out) both;
}
.modal {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; animation: fade .3s ease both;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet { background: var(--tile); color: var(--ink); border-radius: 22px; padding: 24px; width: min(100%, 420px); display: grid; gap: 12px; box-shadow: var(--shadow-card); animation: zoomIn .4s var(--ease-out) both; }
.sheet h2 { margin: 0; font-size: 24px; }
.sheet p { margin: 0; color: var(--muted); }
.soon { display: inline-block; margin-inline-end: 6px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--accent-soft); color: var(--accent-text); }
.paying { display: grid; justify-items: center; gap: 16px; color: #ffffff; font-size: 20px; font-weight: 600; }
.spin { width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, .25); border-top-color: #ffffff; border-radius: 50%; animation: spin .9s linear infinite; }
.tick { width: 72px; height: 72px; border-radius: 50%; background: var(--good); display: grid; place-items: center; animation: pick .5s var(--ease-out) both; }
.tick svg { width: 38px; height: 38px; color: #ffffff; }
.tick svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .15s var(--ease-out) forwards; }

/* motion: entrances move content into place but never hide it */
@keyframes stepIn { from { opacity: 0; transform: translateX(calc(var(--fwd, 1) * 40px)); } }
@keyframes stepBack { from { opacity: 0; transform: translateX(calc(var(--fwd, 1) * -40px)); } }
@keyframes rise { from { transform: translateY(24px); } }
@keyframes heroIn { from { transform: translateY(80px) scale(.94); } }
@keyframes pick { 45% { transform: scale(1.03); } }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes glyphIn { from { transform: translateY(16px) scale(.9); } }
@keyframes reveal { from { transform: scale(.93); } }
@keyframes shine { to { transform: translateX(120%); } }
@keyframes toastIn { from { transform: translate(-50%, 16px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes zoomIn { from { transform: scale(.94); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .spin { animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
  .reveal { transform: none; }
}

@media (min-width: 700px) {
  .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cat { flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 34px 20px 28px; }
  .cat > .chev { display: none; }
  .grid-occ { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

const PINK2 = { dark: '#eda2b2', mid: '#f6c4ce', light: '#fde2e8', thread: '#fff2f5', threadDark: '#e38fa1', bead: '#fff6f8', beadEdge: '#e6aebb', gold: PINK.gold };
const LEAF = { a: '#89a76a', b: '#4e6d3c', st: '#acc78f', vein: '#3c582d' };

function drawPetal(ctx, x, y, ang, len, wid, o, R) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const p = new Path2D();
  p.moveTo(0, 0);
  p.bezierCurveTo(len * 0.22, -wid, len * 0.98, -wid * 1.1, len, 0);
  p.bezierCurveTo(len * 0.98, wid * 1.1, len * 0.22, wid, 0, 0);
  ctx.save();
  ctx.shadowColor = 'rgba(120,60,75,0.22)'; ctx.shadowBlur = len * 0.06; ctx.shadowOffsetY = len * 0.025;
  const g = ctx.createLinearGradient(0, 0, len, 0);
  g.addColorStop(0, o.dark); g.addColorStop(0.55, o.mid); g.addColorStop(1, o.light);
  ctx.fillStyle = g; ctx.fill(p);
  ctx.restore();
  // satin strands
  ctx.save(); ctx.clip(p); ctx.lineCap = 'round';
  const m = Math.max(7, Math.round(wid / 6));
  for (const side of [-1, 1]) {
    for (let k = 0; k <= m; k++) {
      const u = 0.16 + 0.84 * (k / m);
      const ex = bz(0, len * 0.22, len * 0.98, len, u), ey = side * bz(0, wid, wid * 1.1, 0, u) * 0.95;
      ctx.beginPath(); ctx.moveTo(len * 0.05, ey * 0.1); ctx.quadraticCurveTo(ex * 0.55, ey * 0.78, ex, ey);
      ctx.lineWidth = Math.max(1.6, len * 0.017);
      ctx.strokeStyle = k % 2 ? o.thread : o.threadDark;
      ctx.globalAlpha = 0.5 + R() * 0.35;
      ctx.setLineDash([len * 0.05, len * 0.022]); ctx.lineDashOffset = R() * 10;
      ctx.stroke();
    }
  }
  ctx.restore();
  // beaded outline
  const br = Math.max(2.4, len * 0.022);
  for (const side of [-1, 1]) {
    const steps = Math.round(len / (br * 2.2));
    for (let k = 1; k <= steps; k++) {
      const u = k / steps; if (u < 0.12) continue;
      const bx = bz(0, len * 0.22, len * 0.98, len, u), by = side * bz(0, wid, wid * 1.1, 0, u);
      ctx.fillStyle = o.bead; ctx.strokeStyle = o.beadEdge; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; dot(ctx, bx - br * 0.3, by - br * 0.3, br * 0.32);
    }
  }
  ctx.restore();
}
function drawCenter(ctx, x, y, r, o, R) {
  ctx.save();
  const cr = r * 0.15;
  for (let i = 0; i < 24; i++) {
    const a = R() * TAU, l = cr * (1.1 + R() * 0.9);
    ctx.strokeStyle = '#b8801c'; ctx.lineWidth = Math.max(1.2, r * 0.011);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
    ctx.fillStyle = o.gold[i % 4]; dot(ctx, x + Math.cos(a) * l, y + Math.sin(a) * l, Math.max(2, r * 0.022));
  }
  for (let i = 0; i < 60; i++) {
    const a = R() * TAU, d = cr * Math.sqrt(R());
    ctx.fillStyle = o.gold[(i * 7) % 4];
    dot(ctx, x + Math.cos(a) * d, y + Math.sin(a) * d, Math.max(1.8, r * (0.02 + R() * 0.012)));
  }
  ctx.restore();
}
function drawFlower(ctx, x, y, r, o, R, kind) {
  const rot = R() * TAU;
  if (kind === 'peony') {
    for (let i = 0; i < 6; i++) drawPetal(ctx, x, y, rot + i * TAU / 6 + (R() - 0.5) * 0.25, r * (0.9 + R() * 0.12), r * 0.5, o, R);
    for (let i = 0; i < 5; i++) drawPetal(ctx, x, y, rot + 0.4 + i * TAU / 5, r * 0.58, r * 0.3, PINK2, R);
    drawCenter(ctx, x, y, r, o, R);
  } else {
    for (let i = 0; i < 5; i++) drawPetal(ctx, x, y, rot + i * TAU / 5 + (R() - 0.5) * 0.15, r, r * 0.32, o, R);
    drawCenter(ctx, x, y, r * 0.85, o, R);
  }
}
function drawLeaf(ctx, x, y, len, wid, ang, c) {
  c = c || LEAF;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const p = new Path2D();
  p.moveTo(0, 0); p.quadraticCurveTo(len * 0.45, -wid, len, 0); p.quadraticCurveTo(len * 0.45, wid, 0, 0);
  ctx.save();
  ctx.shadowColor = 'rgba(40,60,30,0.22)'; ctx.shadowBlur = len * 0.05; ctx.shadowOffsetY = len * 0.02;
  const g = ctx.createLinearGradient(0, 0, len, 0); g.addColorStop(0, c.b); g.addColorStop(1, c.a);
  ctx.fillStyle = g; ctx.fill(p);
  ctx.restore();
  ctx.save(); ctx.clip(p); ctx.lineCap = 'round';
  ctx.strokeStyle = c.st; ctx.lineWidth = Math.max(1.5, len * 0.012); ctx.setLineDash([len * 0.04, len * 0.015]);
  for (let t = 0.06, i = 0; t < 0.95; t += 0.055, i++) {
    const px = len * t, hw = wid * 0.5 * Math.sin(Math.PI * t) * 1.05;
    for (const side of [-1, 1]) {
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(px + len * 0.035, 0); ctx.lineTo(px - len * 0.012, side * hw); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.strokeStyle = c.vein; ctx.lineWidth = Math.max(1.6, len * 0.014); ctx.setLineDash([len * 0.05, len * 0.02]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.95, 0); ctx.stroke();
  ctx.restore();
}
function drawStem(ctx, x0, y0, cx, cy, x1, y1, w) {
  ctx.save(); ctx.lineCap = 'round';
  const p = new Path2D(); p.moveTo(x0, y0); p.quadraticCurveTo(cx, cy, x1, y1);
  ctx.strokeStyle = '#557341'; ctx.lineWidth = w; ctx.setLineDash([w * 1.7, w * 0.7]); ctx.stroke(p);
  ctx.strokeStyle = '#94b676'; ctx.lineWidth = w * 0.32; ctx.setLineDash([w * 1.2, w * 1.2]); ctx.lineDashOffset = w * 0.4; ctx.stroke(p);
  ctx.restore();
}
function drawBud(ctx, x, y, r, ang, o, R) {
  drawLeaf(ctx, x, y, r * 0.6, r * 0.42, ang + Math.PI + 0.7);
  drawLeaf(ctx, x, y, r * 0.6, r * 0.42, ang + Math.PI - 0.7);
  drawPetal(ctx, x, y, ang, r, r * 0.46, o, R);
  drawPetal(ctx, x, y, ang + 0.18, r * 0.82, r * 0.28, PINK2, R);
}

  drawStem(ctx, 830, 1940, 760, 1760, 795, 1640, 7);
  drawLeaf(ctx, 165, 1770, 240, 110, -2.45);

function cornerOrn(ctx, x, y, sx, sy, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 64, 0, Math.PI / 2); ctx.stroke();
  for (let a = 0.12; a < Math.PI / 2; a += 0.16) dot(ctx, Math.cos(a) * 82, Math.sin(a) * 82, 3);
  ctx.beginPath(); ctx.moveTo(32, 16); ctx.lineTo(48, 32); ctx.lineTo(32, 48); ctx.lineTo(16, 32); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(104, 12); ctx.lineTo(200, 12); ctx.moveTo(12, 104); ctx.lineTo(12, 200); ctx.stroke();
  dot(ctx, 208, 12, 4); dot(ctx, 12, 208, 4);
  ctx.restore();
}
function divider(ctx, cx, cy, w, c) {
  ctx.save(); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx - w / 2, cy); ctx.lineTo(cx - 22, cy); ctx.moveTo(cx + 22, cy); ctx.lineTo(cx + w / 2, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx + 12, cy); ctx.lineTo(cx, cy + 12); ctx.lineTo(cx - 12, cy); ctx.closePath(); ctx.fill();
  dot(ctx, cx - w / 2 - 9, cy, 3.5); dot(ctx, cx + w / 2 + 9, cy, 3.5); dot(ctx, cx - 36, cy, 3.2); dot(ctx, cx + 36, cy, 3.2);
  ctx.restore();
}
function drawDiwaniBg(ctx) {
  const R = rng(3);
  paper(ctx, '#fcf9f3', '#f6f0e4');
  weave(ctx, '#cdbb98', 0.06, R, 4);
  vignette(ctx, 'rgba(150,120,70,1)', 0.10);
  const g = '#b08f4e';
  ctx.save(); ctx.strokeStyle = g;
  ctx.lineWidth = 5; ctx.strokeRect(46, 46, W - 92, H - 92);
  ctx.lineWidth = 1.6; ctx.strokeRect(64, 64, W - 128, H - 128);
  ctx.lineWidth = 1; ctx.globalAlpha = 0.7; ctx.strokeRect(74, 74, W - 148, H - 148);
  ctx.restore();
  [[64, 64, 1, 1], [W - 64, 64, -1, 1], [64, H - 64, 1, -1], [W - 64, H - 64, -1, -1]].forEach(([x, y, sx, sy]) => cornerOrn(ctx, x, y, sx, sy, g));
  divider(ctx, W / 2, 130, 260, g);
  divider(ctx, W / 2, H - 130, 260, g);
}
function drawGoldenBg(ctx) {
  const bg = ctx.createRadialGradient(W / 2, H * 0.42, 80, W / 2, H * 0.5, H * 0.8);
  bg.addColorStop(0, '#17503f'); bg.addColorStop(1, '#08241f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.08; ctx.strokeStyle = '#e2c27c'; ctx.lineWidth = 2;
  for (let y = 0, row = 0; y < H + 140; y += 140, row++) for (let x = (row % 2) * 70; x < W + 140; x += 140) { star8(ctx, x, y, 34); ctx.stroke(); }
  ctx.restore();
  const x0 = 120, x1 = 960, cx = 540, r = 420, spring = 690, bottom = 1780;
  const arch = inset => {
    ctx.beginPath(); ctx.moveTo(x0 + inset, bottom - inset); ctx.lineTo(x0 + inset, spring);
    ctx.arc(cx, spring, r - inset, Math.PI, 0, false); ctx.lineTo(x1 - inset, bottom - inset); ctx.closePath();
  };
  ctx.save(); arch(0); ctx.fillStyle = 'rgba(3,20,17,0.45)'; ctx.fill(); ctx.restore();
  const gold = ctx.createLinearGradient(0, 120, 0, bottom);
  gold.addColorStop(0, '#f3dc9c'); gold.addColorStop(0.5, '#c9a24f'); gold.addColorStop(1, '#e6c77f');
  ctx.save(); ctx.strokeStyle = gold; ctx.fillStyle = gold;
  ctx.lineWidth = 5; arch(0); ctx.stroke();
  ctx.lineWidth = 1.6; arch(18); ctx.stroke();
  star8(ctx, cx, spring - r + 96, 30); ctx.fill();
  ctx.lineWidth = 1.5; star8(ctx, cx, spring - r + 96, 46); ctx.stroke();
  for (let x = x0 + 70; x <= x1 - 70; x += 30) dot(ctx, x, bottom - 48, 2.6);
  [[72, 120, 18], [W - 72, 120, 18], [96, 250, 10], [W - 96, 250, 10], [72, 1840, 14], [W - 72, 1840, 14]].forEach(([x, y, s]) => { star8(ctx, x, y, s); ctx.fill(); });
  ctx.restore();
}
function moon(ctx, x, y, r, c) {
  const o = document.createElement('canvas'); o.width = o.height = Math.ceil(r * 2 + 4);
  const m = o.getContext('2d'); m.fillStyle = c;
  m.beginPath(); m.arc(r + 2, r + 2, r, 0, TAU); m.fill();
  m.globalCompositeOperation = 'destination-out';
  m.beginPath(); m.arc(r + 2 + r * 0.42, r + 2 - r * 0.22, r * 0.86, 0, TAU); m.fill();
  ctx.drawImage(o, x - r - 2, y - r - 2);
}
function cloud(ctx, x, y, w, c) {
  const r = w * 0.17;
  ctx.save(); ctx.fillStyle = c;
  ctx.shadowColor = 'rgba(80,120,170,0.18)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.beginPath();
  [[-0.33, 0.1, 0.85], [-0.12, -0.45, 1.2], [0.14, -0.3, 1.05], [0.34, 0.12, 0.8], [0, 0.25, 1.1]].forEach(([dx, dy, k]) => {
    const cx = x + dx * w, cy = y + dy * r; ctx.moveTo(cx + r * k, cy); ctx.arc(cx, cy, r * k, 0, TAU);
  });
  ctx.rect(x - w * 0.4, y, w * 0.8, r * 1.2);
  ctx.fill(); ctx.restore();
}
function drawSkyBg(ctx) {
  const R = rng(11);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#d3e6f5'); g.addColorStop(0.55, '#f2f8fc'); g.addColorStop(1, '#e1edf7');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  weave(ctx, '#b9cfe2', 0.05, R, 4);

    const side = i % 3;
    const x = side === 0 ? 40 + R() * (W - 80) : side === 1 ? 30 + R() * 90 : W - 120 + R() * 90;
    const y = side === 0 ? 40 + R() * 240 : 300 + R() * 1250;
    ctx.globalAlpha = 0.55 + R() * 0.4; ctx.fillStyle = R() > 0.5 ? '#ffffff' : '#f3df9a';
    star5(ctx, x, y, 5 + R() * 9); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = '#a9c4de'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  [[190, 170], [300, 105], [760, 135]].forEach(([x, l]) => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, l); ctx.stroke(); });
  ctx.setLineDash([]); ctx.fillStyle = '#f3df9a'; ctx.strokeStyle = '#d9c070'; ctx.lineWidth = 2;
  [[190, 190, 22], [300, 122, 16], [760, 155, 19]].forEach(([x, y, s]) => { star5(ctx, x, y, s); ctx.fill(); ctx.stroke(); });
  ctx.restore();
  moon(ctx, 900, 210, 74, '#f6e3a1');
  cloud(ctx, 230, 1745, 560, '#c4dbef'); cloud(ctx, 830, 1715, 600, '#c4dbef');
  cloud(ctx, 120, 1860, 640, '#ffffff'); cloud(ctx, 600, 1890, 760, '#ffffff'); cloud(ctx, 1050, 1850, 560, '#ffffff');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 1890, W, H - 1890);
}
function oliveLeaf(ctx, x, y, len, wid, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  const g = ctx.createLinearGradient(0, -wid, 0, wid); g.addColorStop(0, '#9aa877'); g.addColorStop(1, '#6b7a4b');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -wid, len, 0); ctx.quadraticCurveTo(len * 0.5, wid, 0, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(236,238,214,0.75)'; ctx.lineWidth = 1.4;

function olive(ctx, x, y, R) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(R() * Math.PI);
  const purple = R() > 0.5;
  const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, 22);
  g.addColorStop(0, purple ? '#7a6a80' : '#a0ab66'); g.addColorStop(1, purple ? '#3e3044' : '#55622c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 15, 21, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawBranch(ctx, P, n, R) {
  ctx.save(); ctx.strokeStyle = '#76694a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); ctx.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); ctx.stroke();
  for (let i = 0; i < n; i++) {
    const u = 0.06 + 0.88 * i / (n - 1);
    const x = bz(P[0][0], P[1][0], P[2][0], P[3][0], u), y = bz(P[0][1], P[1][1], P[2][1], P[3][1], u);
    const a = Math.atan2(bzd(P[0][1], P[1][1], P[2][1], P[3][1], u), bzd(P[0][0], P[1][0], P[2][0], P[3][0], u));
    const side = i % 2 ? 1 : -1, len = (82 + R() * 40) * (1 - u * 0.3);
    oliveLeaf(ctx, x, y, len, len * 0.26, a + side * (0.6 + R() * 0.25));
    if (i % 3 === 1) { const oa = a + side * 1.5; olive(ctx, x + Math.cos(oa) * 28, y + Math.sin(oa) * 28, R); }
  }
  const ta = Math.atan2(bzd(P[0][1], P[1][1], P[2][1], P[3][1], 1), bzd(P[0][0], P[1][0], P[2][0], P[3][0], 1));
  oliveLeaf(ctx, P[3][0], P[3][1], 76, 20, ta);
  ctx.restore();
}

/* ---- ornaments shared by the newer designs ---- */
function spiral(ctx, x, y, r, dir) {
  const T = 1.6 * TAU; ctx.beginPath();
  for (let a = 0; a <= T; a += 0.15) {
    const d = r * (1 - a / T), px = x + Math.cos(dir * a) * d, py = y + Math.sin(dir * a) * d;
    if (a) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function leafShape(ctx, x, y, len, wid, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -wid, len, 0); ctx.quadraticCurveTo(len * 0.5, wid, 0, 0); ctx.fill();
  ctx.restore();
}
function ornCorner(ctx, x, y, sx, sy, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineCap = 'round';
  ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(14, 196); ctx.bezierCurveTo(14, 80, 80, 14, 196, 14); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(34, 150); ctx.bezierCurveTo(40, 92, 92, 40, 150, 34); ctx.stroke();
  ctx.lineWidth = 2; spiral(ctx, 206, 26, 13, 1); spiral(ctx, 26, 206, 13, -1);
  [0.28, 0.5, 0.72].forEach(u => {
    const px = bz(14, 14, 80, 196, u), py = bz(196, 80, 14, 14, u);
    const a = Math.atan2(bzd(196, 80, 14, 14, u), bzd(14, 14, 80, 196, u));
    leafShape(ctx, px, py, 30, 9, a + Math.PI / 2 + 0.5);
  });
  [-0.55, 0, 0.55].forEach(d => leafShape(ctx, 26, 26, 36, 10, Math.PI / 4 + d));
  dot(ctx, 26, 26, 5);
  ctx.restore();
}
function flourish(ctx, cx, cy, w, c) {
  ctx.save(); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineCap = 'round'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - w / 2, cy); ctx.lineTo(cx - 44, cy); ctx.moveTo(cx + 44, cy); ctx.lineTo(cx + w / 2, cy); ctx.stroke();
  spiral(ctx, cx - 26, cy - 1, 11, 1); spiral(ctx, cx + 26, cy - 1, 11, -1);
  ctx.beginPath(); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx, cy + 9); ctx.lineTo(cx - 8, cy); ctx.closePath(); ctx.fill();
  leafShape(ctx, cx, cy - 8, 20, 6, -Math.PI / 2);
  dot(ctx, cx - w / 2 - 7, cy, 3); dot(ctx, cx + w / 2 + 7, cy, 3);
  ctx.restore();
}
function goldGradient(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#ecd59c'); g.addColorStop(0.5, '#b8954f'); g.addColorStop(1, '#dcc07e');

  ctx.restore();
}

  ctx.fillStyle = '#3d3a2a'; dot(ctx, 0, -r * 0.05, r * 0.14);
  ctx.fillStyle = '#2f2a1e'; for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + (i - 3.5) * 0.3; dot(ctx, Math.cos(a) * r * 0.26, Math.sin(a) * r * 0.26 - r * 0.05, r * 0.035); }

}
function lavender(ctx, x, y, len, ang, R) {

function cornflower(ctx, x, y, r, R) {

function umbel(ctx, x, y, r, R) {

    for (let j = 0; j < 6; j++) { ctx.fillStyle = '#fffef6'; dot(ctx, ex + (R() - 0.5) * r * 0.3, ey - R() * r * 0.18, 2.6 + R() * 1.4); ctx.fillStyle = 'rgba(160,160,130,0.45)'; dot(ctx, ex + (R() - 0.5) * r * 0.2, ey - R() * r * 0.1, 1); }

function buttercup(ctx, x, y, r) {

function meadowFlower(ctx, type, x, y, R) {
  if (type === 'daisy') daisy(ctx, x, y, 22 + R() * 14, R);
  else if (type === 'poppy') poppy(ctx, x, y, 24 + R() * 12, R, R() > 0.5 ? ['#e7765c', '#b9432f', '#f3a48c'] : ['#f0a58f', '#d0705a', '#f8c8b8']);
  else if (type === 'lavender') lavender(ctx, x, y, 70 + R() * 30, -Math.PI / 2 + (R() - 0.5) * 0.4, R);

  const prompt = `Write invitation card wording for a Saudi ${OCC_EN[oc]} card, in ${L === 'ar' ? 'Arabic: warm, elegant, formal Saudi style, no diacritics' : 'English: warm and elegant'}.
Opening line: ${OPEN_RULE[oc]}.
Closing line: one short line thanking or welcoming the guests (at most 7 words).
Do not include any names, dates or places. Avoid repeating these existing lines: ${JSON.stringify(openingsList(state).map(o => o.text))}.
Reply with only JSON: {"openings": ["...", "...", "..."], "closings": ["...", "..."]}`;
  btn.disabled = true; status.textContent = t('aiWorking');
  try {
    const r = await AI.json(prompt, { cache: false });
    const ops = (r && Array.isArray(r.openings) ? r.openings : []).map(x => cleanStr(x, 140)).filter(Boolean).slice(0, 3);
    const cls = (r && Array.isArray(r.closings) ? r.closings : []).map(x => cleanStr(x, 80)).filter(Boolean).slice(0, 2);
    if (!ops.length && !cls.length) { status.textContent = t('aiFail'); return; }
    state.customOpenings = ops; state.customClosings = cls;
    if (ops[0]) state.openingText = ops[0];
    save(); renderScreen();
  } catch (e) {
    if (e && e.code === 'cancelled') return;
    status.textContent = aiError(e);
  } finally { btn.disabled = false; }
}
async function aiReadCard(file) {
  const L = state.lang;
  const prompt = `This photo is an invitation card the customer likes. She wants a NEW card in the same spirit with her own details. Reply with only JSON:
{"occasion": one of ["weddingMen","weddingWomen","babyBoy","babyGirl","twins","eidFitr","eidAdha","graduation","ceremony","other"] (weddingMen = a men's wedding card naming the fathers and the groom; weddingWomen = a women's wedding card naming the bride or the couple; twins = newborn twins; eidFitr/eidAdha = an Eid greeting or Eid-gathering card; ceremony = an honoring or opening ceremony; other = any gathering or dinner),
 "style": the closest of ["blossom","diwani","golden","sky","olive","ivory","sage","navy","roses","balloon","najdi","relief","bisht","velvet","henna","carouselPink","carouselBlue","toile","meadow"],
 "reason": "a short phrase in ${L === 'ar' ? 'Arabic' : 'English'} describing the card's look (at most 8 words)",
 "opening": "the card's opening phrase exactly as written, or empty",
 "closing": "the card's closing line exactly as written, or empty"}
Styles: ${STYLE_GUIDE}
Opening phrase: for a wedding or milka, the words before the hosts' names (like "يتشرف"); for a baby, the sentence before the baby's name; otherwise the phrase before the main name or title. Never copy personal names.`;
  state.reading = true; state.read = null; renderScreen();
  try {
    const r = await AI.json(prompt, { images: [file] });
    const occ = r && OCCASIONS.some(o => o.id === r.occasion) ? r.occasion : null;
    const sty = r && TEMPLATES[r.style] ? r.style : null;
    state.read = occ || sty ? { occasion: occ, style: sty, reason: cleanStr(r.reason, 80), opening: cleanStr(r.opening, 140), closing: cleanStr(r.closing, 80) } : { failed: true };
  } catch (e) {
    state.read = { failed: true, msg: e && HIDE_CODES.includes(e.code) ? '' : aiError(e) };
  } finally { state.reading = false; renderScreen(); }
}

const asst = { open: false, busy: false, msgs: [] };
function asstSystem() {
  const L = state.lang;
  const snap = {
    step: state.step, lang: L, occasion: state.occasion, template: state.template,
    fields: state.fields, date: state.date, timeFrom: state.timeFrom, timeTo: state.timeTo,
    venue: state.venue, venueDetail: state.venueDetail, nameFont: state.nameFont, bodyFont: state.bodyFont
  };
  const occIds = Object.keys(FIELDS);
  // Everything per occasion up front, so a first message that names the occasion can also fill in names and pick a design
  const perOcc = occIds.map(oc => `- ${oc}: fields {${FIELDS[oc].map(f => `${f.k}: ${f.en}${f.opt ? ' (optional)' : ''}`).join('; ')}}; designs allowed: ${allowedFor(oc).join(', ')}`).join('\n');
  const designNames = TEMPLATE_IDS.map(id => `${id} = «${TEMPLATES[id].name[L]}»`).join(', ');
  return `You are the in-app assistant of "${CONFIG.brand.en}", a Saudi occasion-card builder. The customer picks the occasion, then designs the card on one edit screen (design, fonts, names, date, place and wording; she taps a part of the card to edit it), then reviews it and pays. Be warm, brief and practical; in Arabic address the customer as a Saudi woman (feminine). Guide her to the next missing piece (occasion, then design, names, date, place), one question at a time, and apply what she asks for right away.
Today: ${todayISO()}.
Current card state: ${JSON.stringify(snap)}
Occasions: weddingMen (men's wedding), weddingWomen (women's wedding), babyGirl, babyBoy, twins, eidFitr, eidAdha, graduation, ceremony, other.
Per occasion, its name fields and the designs allowed for it:
${perOcc}
Design looks (by id): ${STYLE_GUIDE}
Design names the customer sees: ${designNames}.
Name fonts: ${FONT_GROUPS[L].flatMap(g => g.fonts).join(', ')}. Body fonts: ${BODY_FONTS[L].join(', ')}.
Reply with only one JSON object:
{"say": "your reply to the customer in her language (at most 60 words, plain text)",
 "apply": {"occasion": "", "template": "", "nameFont": "", "bodyFont": "", "fields": {}, "date": "YYYY-MM-DD", "timeFrom": "HH:MM", "timeTo": "HH:MM", "venue": "", "venueDetail": "", "opening": "", "closing": "", "goStep": ""}}
Every "apply" key is optional: include only what should change, and omit "apply" entirely when nothing changes. "goStep" moves her to that screen: "occasion", "edit" or "review".
The date and the venue start empty and the times start at the occasion's usual hours: treat the times as not given until she tells you, and ask for the date and place instead of calling the card ready.
Whenever she mentions a name, put it in apply.fields right away, using the field keys of the occasion you set in this same reply (or the current one); keep names exactly as she wrote them.
She may also ask how the site works, since this panel is the site's Help: a card costs ${CONFIG.price} SAR including VAT, there's no sign-up, she sees the whole card (with a watermark) before paying, pays online through Tap, and then saves the finished image and shares it on WhatsApp. If she wants to talk to a person, say WhatsApp support is coming soon. Answer briefly, then offer to start her card.
In Arabic, call the card «كرت», never «بطاقة», and in names write «بن» between a name and the father's name, never «ابن».
Template ids, occasion ids and field keys go only inside "apply". In "say", call a design by the name she sees (for example «${TEMPLATES.bisht.name[L]}»), never by its id, and never show ids or English code words. Use ids and font names exactly as listed; never invent them.`;
}
function asstApply(a) {
  if (!a || typeof a !== 'object') return;
  if (a.occasion && FIELDS[a.occasion]) setOccasion(a.occasion);
  if (a.template && TEMPLATES[a.template] && (!state.occasion || allowedFor(state.occasion).includes(a.template))) { state.template = a.template; state.designPicked = true; }
  const fams = new Set([...FONT_GROUPS.ar, ...FONT_GROUPS.en].flatMap(g => g.fonts).concat(BODY_FONTS.ar, BODY_FONTS.en));
  if (typeof a.nameFont === 'string' && fams.has(a.nameFont)) state.nameFont = a.nameFont;
  if (typeof a.bodyFont === 'string' && fams.has(a.bodyFont)) state.bodyFont = a.bodyFont;
  if (a.fields && typeof a.fields === 'object' && state.occasion) {
    FIELDS[state.occasion].forEach(f => { const v = cleanStr(a.fields[f.k], 80); if (v) state.fields[f.k] = v; });
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(a.date || '')) state.date = a.date;
  if (/^\d{1,2}:\d{2}$/.test(a.timeFrom || '')) state.timeFrom = a.timeFrom.padStart(5, '0');
  if (/^\d{1,2}:\d{2}$/.test(a.timeTo || '')) state.timeTo = a.timeTo.padStart(5, '0');
  if (cleanStr(a.venue)) state.venue = cleanStr(a.venue, 80);
  if (cleanStr(a.venueDetail)) state.venueDetail = cleanStr(a.venueDetail, 80);
  if (cleanStr(a.opening)) { state.customOpenings = [cleanStr(a.opening, 140)]; state.openingText = state.customOpenings[0]; }
  if (cleanStr(a.closing)) { state.customClosings = [cleanStr(a.closing, 80)]; state.closingText = state.customClosings[0]; }
  if (state.occasion && !state.template) state.template = styleOrder()[0];
  save();
  let target = FLOW.includes(a.goStep) ? a.goStep : null;
  // opened from Help on the home or upload page: once there's an occasion, take her to the card
  if (!target && !FLOW.includes(state.step) && state.occasion) target = 'edit';
  if (target && !state.occasion) target = 'occasion';
  if (target && target !== state.step) go(target); else renderScreen();
}
function asstRender() {
  const panel = $('#asstPanel'); if (panel.hidden) return;
  $('#asstTitle').textContent = t('asstTitle');
  $('#asstInput').placeholder = t('asstPh');
  $('#asstSendBtn').textContent = t('asstSend');
  $('#asstSendBtn').disabled = asst.busy;
  const msgs = [{ role: 'bot', show: t('asstHi') }, ...asst.msgs];
  $('#asstMsgs').innerHTML = msgs.map(m => `<div class="asst-m ${m.role === 'user' ? 'user' : 'bot'}">${esc(m.show)}</div>`).join('')
    + (asst.busy ? '<div class="asst-m bot">…</div>' : '');
  const box = $('#asstMsgs'); box.scrollTop = box.scrollHeight;
}
async function asstSend(txt) {
  if (!txt || asst.busy) return;
  asst.msgs.push({ role: 'user', raw: txt, show: txt });
  asst.busy = true; asstRender();
  try {
    const convo = asst.msgs.map(m => (m.role === 'user' ? 'Customer: ' : 'Assistant: ') + m.raw).join('\n');
    const r = await AI.json(`${asstSystem()}\n\nConversation so far:\n${convo}`, { cache: false });
    asst.msgs.push({ role: 'bot', raw: JSON.stringify(r || {}), show: cleanStr(r && r.say, 600) || t('asstFail') });
    if (r && r.apply) asstApply(r.apply);
  } catch (e) {
    if (!(e && e.code === 'cancelled')) asst.msgs.push({ role: 'bot', raw: '{}', show: aiError(e) });
  } finally { asst.busy = false; asstRender(); }
}

function openKeyBox() {
  const has = !!AI.key;
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
    <h2 id="keyTitle">${t('keyTitle')}</h2><p>${t('keySub')}</p>
    <div class="field"><input id="keyInput" type="password" autocomplete="off" spellcheck="false" dir="ltr" placeholder="sk-ant-…" aria-label="${esc(t('keyTitle'))}"></div>
    <button class="btn btn-primary" id="keySave" type="button">${t('keySave')}</button>
    ${has ? `<button class="btn btn-ghost" id="keyRemove" type="button">${t('keyRemove')}</button>` : ''}
    <p class="hint">${has || CONFIG.aiProxy ? t('keyOn') : t('keyOff')}</p>
    <button class="btn btn-secondary" data-close type="button">${t('close')}</button></div>`);
  const done = msg => {
    closeModal(); refreshAI(); toast(msg);
    if (location.hash === '#ai') history.replaceState(null, '', location.pathname + location.search);
  };
  $('#keySave').addEventListener('click', () => {
    const v = $('#keyInput').value.trim();
    if (!/^sk-ant-[\w-]{20,}$/.test(v)) { toast(t('keyBad')); $('#keyInput').focus(); return; }
    try { localStorage.setItem('krootnow-ai-key', v); } catch (e) { /* storage unavailable: works until reload */ }
    AI.key = v; AI.img = true; AI.maxBytes = 5 * 1024 * 1024; AI.off = false;
    done(t('keySaved'));
  });
  const rm = $('#keyRemove');
  if (rm) rm.addEventListener('click', () => {
    try { localStorage.removeItem('krootnow-ai-key'); } catch (e) { /* storage unavailable */ }
    AI.key = CONFIG.aiKey || '';
    done(t('keyRemoved'));
  });
  $('#keyInput').focus();
}
function openAsst() {
  asst.open = true; $('#asstPanel').hidden = false; refreshAI(); asstRender(); $('#asstInput').focus();
}
function setupAsst() {
  const btn = $('#asstBtn'), panel = $('#asstPanel');
  btn.addEventListener('click', openAsst);
  $('#asstClose').addEventListener('click', () => { asst.open = false; panel.hidden = true; refreshAI(); });

    e.preventDefault();

function isoPlus(days) { const d = new Date(); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function freshState(lang) {

    tashkeel: true,

    showQR: false, showHijri: true, note: 0, dua: true, duaText: null, nameFont: null, bodyFont: null,

function save() {
  try {
    const { uploadURL, uploadFile, read, reading, ...rest } = state;
    localStorage.setItem(KEY, JSON.stringify(rest));
  } catch (e) { /* storage unavailable */ }
}

function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      // drafts saved before the occasion rework carry the old ids
      const MIG = { wedding: 'weddingMen', milka: 'weddingWomen', gathering: 'other' };
      if (MIG[d.occasion]) d.occasion = MIG[d.occasion];
      if (d.occasion && !FIELDS[d.occasion]) d.occasion = null;
      if (d.occasion && d.template && !allowedFor(d.occasion).includes(d.template)) { d.template = null; d.matched = null; d.designPicked = false; }
      // drafts from the eight-step flow: every design step is now the one edit screen
      if (['style', 'names', 'when', 'where', 'wording', 'fonts'].includes(d.step)) d.step = 'edit';
      if (d.designPicked == null) d.designPicked = !!d.template && !d.styleAuto;
      delete d.skipped; delete d.styleAuto; delete d.reached;
    }
    return d;
  } catch (e) { return null; }
}
function setOccasion(id) {
  if (state.occasion === id) return;
  state.occasion = id; state.fields = {};
  state.openingText = null; state.closingText = null; state.customOpenings = []; state.customClosings = [];
  const [a, b] = DEFAULT_TIMES[id]; state.timeFrom = a; state.timeTo = b;
  state.dua = isWedding(id); state.confirmed = false;
  if (state.template && !allowedFor(id).includes(state.template)) { state.template = null; state.matched = null; state.designPicked = false; }
}

      stage.style.setProperty('--q', (0.3 + 0.7 * p).toFixed(3));
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
    addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll);
    update();
    cleanups.push(() => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); });
  }

function occTileHTML(id, i) {
  const o = OCCASIONS.find(x => x.id === id), L = state.lang;
  return `<button class="occ" type="button" style="--i:${i}" data-act="occ" data-val="${id}" aria-pressed="${state.occasion === id}">${ICON[id] || ''}<span>${esc(o.short[L])}</span>${o.desc ? `<span class="occ-sub">${esc(o.desc[L])}</span>` : ''}</button>`;
}
function renderSubPanel() {
  const grid = $('#subGrid'), title = $('#subTitle');
  if (!grid || !occNav.cat) return;
  title.textContent = t('subTitle')[occNav.cat];
  grid.innerHTML = CAT_SUBS[occNav.cat].map((id, i) => id === 'eid'
    ? `<button class="occ" type="button" style="--i:${i}" data-act="eidOpen" aria-pressed="${EID_TYPES.includes(state.occasion)}">${ICON.eid}<span>${t('eidName')}</span><span class="occ-sub">${t('eidSub')}</span></button>`
    : occTileHTML(id, i)).join('');
}
function renderCrumbs() {
  const c = $('#crumbs'); if (!c) return;
  const sep = `<span class="crumb-sep" aria-hidden="true">${CHEV}</span>`;
  const parts = [{ lv: 0, label: t('crumbRoot') }];
  if (occNav.level >= 1 && occNav.cat) parts.push({ lv: 1, label: CATEGORIES.find(x => x.id === occNav.cat)[state.lang] });
  if (occNav.level >= 2) parts.push({ lv: 2, label: t('eidName') });
  c.innerHTML = parts.map(p => `<button class="crumb" type="button" data-act="crumb" data-val="${p.lv}" aria-current="${p.lv === occNav.level ? 'step' : 'false'}">${esc(p.label)}</button>`).join(sep);
}
function slideDeck(lv, instant) {
  occNav.level = lv;
  const track = $('#deckTrack'); if (!track) return;
  const s = document.documentElement.dir === 'rtl' ? 1 : -1;
  if (instant) track.classList.add('drag');
  track.style.transform = `translateX(${s * lv * 100}%)`;
  if (instant) { void track.offsetWidth; track.classList.remove('drag'); }
  track.querySelectorAll('.panel').forEach((p, i) => p.toggleAttribute('inert', i !== lv));
  renderCrumbs();
  const hint = $('#deckHint'); if (hint) hint.hidden = lv === 0;
}
function canDeckForward() {
  if (occNav.level === 0) return !!occNav.cat;
  if (occNav.level === 1) return occNav.cat === 'events';
  return false;
}
function setupDeckSwipe() {
  const deck = $('#deck'), track = $('#deckTrack'); if (!deck) return;
  let sx = 0, sy = 0, active = false, horiz = false;
  deck.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { active = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true; horiz = false;
  }, { passive: true });
  deck.addEventListener('touchmove', e => {
    if (!active) return;
    let dx = e.touches[0].clientX - sx; const dy = e.touches[0].clientY - sy;
    if (!horiz) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) { horiz = true; track.classList.add('drag'); }
      else if (Math.abs(dy) > 16) { active = false; return; }
      else return;
    }
    const s = document.documentElement.dir === 'rtl' ? 1 : -1;
    const ok = dx * s > 0 ? canDeckForward() : occNav.level > 0;
    if (!ok) dx *= 0.3;
    track.style.transform = `translateX(calc(${s * occNav.level * 100}% + ${Math.round(dx)}px))`;
  }, { passive: true });
  const end = e => {
    if (!active) return;
    active = false;
    if (!horiz) return;
    track.classList.remove('drag');
    const dx = e.changedTouches[0].clientX - sx;
    const s = document.documentElement.dir === 'rtl' ? 1 : -1, f = dx * s;
    if (f > 70 && canDeckForward()) slideDeck(occNav.level + 1);
    else if (f < -70 && occNav.level > 0) slideDeck(occNav.level - 1);
    else slideDeck(occNav.level);
  };
  deck.addEventListener('touchend', end);
  deck.addEventListener('touchcancel', end);
}
