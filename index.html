  if (DL) {
    try { await DL.save({ filename: name, data: blob }); toast(t('saved')); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') return toast(t('tryAgain'));
      DL = null; toast(t('longPress'));
    }
    return;
  }
  if (!window.claude) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast(t('saved'));
    return;
  }
  toast(t('longPress'));
}

const ACTIONS = {
  home() { go('welcome', 'back'); },
  back() { back(); },
  lang() {
    if (!CONFIG.english) return;
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    state.openingText = null; state.closingText = null; state.customOpenings = []; state.customClosings = [];
    state.cardOpening = ''; state.cardClosing = ''; state.duaText = null; state.nameFont = null; state.bodyFont = null;
    save(); renderScreen();
  },
  help() {
    // until a WhatsApp number is set, Help opens the assistant instead of a "coming soon" note
    if (!CONFIG.supportWhatsApp && AI.on()) { closeModal(); openAsst(); return; }
    const link = CONFIG.supportWhatsApp ? `<a class="btn btn-wa" href="https://wa.me/${encodeURIComponent(CONFIG.supportWhatsApp)}" target="_blank" rel="noopener">${ICON.chat}${t('helpLink')}</a><p class="hint" dir="ltr">+${esc(CONFIG.supportWhatsApp)}</p>` : `<p class="hint">${t('helpNoNumber')}</p>`;
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle">${t('helpTitle')}</h2><p>${t('helpBody')}</p>${link}<button class="btn btn-secondary" data-close type="button">${t('close')}</button></div>`);
  },
  start() { const L = state.lang; state = freshState(L); draft = null; save(); go('occasion'); },
  resume() { state = Object.assign(freshState(), draft, { paid: false }); if (!CONFIG.english) state.lang = 'ar'; if (!FLOW.includes(state.step)) state.step = 'review'; if (state.occasion && !state.template) state.template = styleOrder()[0]; draft = null; go(state.step); },
  upload() { const L = state.lang; state = freshState(L); state.fromUpload = true; draft = null; go('upload'); },
  afterUpload() {
    const r = state.read;
    if (r && !r.failed) {
      if (r.occasion) setOccasion(r.occasion);
      if (r.style && (!state.occasion || allowedFor(state.occasion).includes(r.style))) { state.matched = r.style; state.template = r.style; }
      if (r.opening && isArabic(r.opening) === (state.lang === 'ar')) { state.cardOpening = r.opening; state.openingText = r.opening; }
      if (r.closing && isArabic(r.closing) === (state.lang === 'ar')) { state.cardClosing = r.closing; state.closingText = r.closing; }
      if (!r.occasion) return go('occasion');
      if (!state.template) state.template = styleOrder()[0];
      state.designPicked = !!r.style; ui.sheet = r.style ? null : 'design';
      return go('edit');
    }
    go('occasion');
  },
  cat(id, el) {
    occNav.cat = id;
    document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    renderSubPanel();
    slideDeck(1);
  },
  eidOpen() { slideDeck(2); },
  crumb(lv) { slideDeck(+lv); },
  occ(id, el) {
    setOccasion(id);
    document.querySelectorAll('.occ').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    // a design picked from the home page gallery (or matched from an upload) is kept; otherwise the design strip opens first
    state.fromGallery = false;
    if (!state.template) { state.template = styleOrder()[0]; state.designPicked = false; }
    ui.sheet = state.designPicked ? null : 'design'; ui.k = null;
    save(); setTimeout(() => go('edit'), 220);
  },
  tpl(id, el) {
    state.template = id; state.designPicked = true;
    document.querySelectorAll('.d-tile').forEach(b => {
      const on = b === el; b.setAttribute('aria-pressed', String(on));
      const tick = b.querySelector('.d-tick');
      if (on && !tick) b.insertAdjacentHTML('beforeend', '<span class="d-tick">✓</span>');
      if (!on && tick) tick.remove();
    });
    const h = $('#edSheet h2'); if (h) h.textContent = t('designTitle');
    save(); renderProgress(); scheduleRender();
  },
  next() { next(); },
  goStep(step) {
    if (step === state.step || !FLOW.includes(step)) return;
    if (step !== 'occasion' && !state.occasion) { toast(t('pickOcc')); return; }
    if (step === 'review' && !state.template) { toast(t('pickStyle')); return; }
    ui.sheet = null; ui.k = null;
    go(step, FLOW.indexOf(step) < FLOW.indexOf(state.step) ? 'back' : 'fwd');
  },
  sheet(kind) { if (state.step === 'edit' && ui.sheet === kind) closeSheet(); else openSlot(kind); },
  closeSheet() { closeSheet(); },
  hit(_, el) { tipSeen(); openSlot(el.dataset.slot, el.dataset.k || null); },
  tipOk() { tipSeen(); },
  fontMode(mode) { ui.fontMode = mode; renderSheet(); },
  fontGroup(i) { ui.fontGroup = +i; renderSheet(); },
  quick() { openAsst(); },
  note(i, el) {
    state.note = +i;
    document.querySelectorAll('[data-act="note"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    saveSoon(); scheduleRender();
  },
  nameFont(fam, el) {
    state.nameFont = fam || null;
    document.querySelectorAll('[data-act="nameFont"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    saveSoon(); scheduleRender();
  },
  bodyFont(fam, el) {
    state.bodyFont = fam || null;
    document.querySelectorAll('[data-act="bodyFont"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    saveSoon(); scheduleRender();
  },
  quickOcc(id) { const L = state.lang; state = freshState(L); draft = null; setOccasion(id); state.template = styleOrder()[0]; ui.sheet = 'design'; ui.k = null; save(); go('edit'); },
  galFilter(occ, el) {
    document.querySelectorAll('.gal-pill').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    document.querySelectorAll('#galRow .g-tile').forEach(tile => { tile.hidden = occ !== 'all' && !tile.dataset.occs.split(' ').includes(occ); });
    const row = $('#galRow'); if (row) row.scrollTo({ left: 0, behavior: reducedMotion() ? 'auto' : 'smooth' });
  },
  galScroll(dir) {
    const row = $('#galRow'); if (!row) return;
    const rtl = document.documentElement.dir === 'rtl';
    row.scrollBy({ left: (rtl ? -1 : 1) * Number(dir) * row.clientWidth * 0.8, behavior: reducedMotion() ? 'auto' : 'smooth' });
  },
  pickDesign(tp) { const L = state.lang; state = freshState(L); state.template = tp; state.designPicked = true; state.fromGallery = true; draft = null; save(); go('occasion'); },
  aiWord(_, el) { aiWording(el); },
  pay(_, el) {
    if (CONFIG.payUrl) { if (el.dataset.val === 'card') payCard(el); else payTap(el); return; }
    openModal(`<div class="paying" role="status"><span class="spin"></span><span>${t('paying')}</span></div>`);
    $('#modal').onclick = null;
    setTimeout(() => {
      $('#modal').innerHTML = `<div class="paying" role="status"><span class="tick">${ICON.check}</span><span>${t('paid')}</span></div>`;
      setTimeout(() => {
        closeModal();
        state.paid = true; state.orderNo = 'KN-' + String(Math.floor(10000 + Math.random() * 90000));
        go('done');
      }, 700);
    }, 1400);
  },
  applePayGate() { if (buyerOk(true)) applePayGateCheck(); },
  save() { saveCard(); },
  share() { shareCard(); },
  newCard() { const L = state.lang; state = freshState(L); draft = null; save(); go('occasion'); }
};

/* ================= events ================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACTIONS[a.dataset.act]; if (fn) fn(a.dataset.val, a, e);
});
document.addEventListener('input', e => {
  const el = e.target, key = el.dataset && el.dataset.bind; if (!key) return;
  el.classList.remove('invalid');
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (key.startsWith('fields.')) state.fields[key.slice(7)] = val; else state[key] = val;
  if (key === 'date') { const h = $('#hijriHint'); if (h) h.textContent = hijriHint() || t('hijriAuto'); }
  // the QR option appears, switched on, once a map link is in
  if (key === 'mapLink') { const ok = !!mapUrl(state); state.showQR = ok; const r = $('#qrRow'); if (r) { r.hidden = !ok; const c = r.querySelector('input'); if (c) c.checked = ok; } }
  if (key === 'buyerName' || key === 'buyerContact') { clearTimeout(tapUI.appleTimer); tapUI.appleTimer = setTimeout(applePayGateCheck, 700); }
  if (key === 'dua') { save(); renderSheet(); scheduleRender(); return; }
  if (key.startsWith('fields.') || key === 'venue' || key === 'date') { renderProgress(); refreshDock(); }
  saveSoon(); scheduleRender();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'cardFile') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (state.uploadURL) URL.revokeObjectURL(state.uploadURL);
  state.uploadURL = URL.createObjectURL(f); state.uploadFile = f; state.read = null;
  if (AI.on() && AI.img && (!AI.maxBytes || f.size <= AI.maxBytes)) aiReadCard(f); else renderScreen();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  // Enter in a sheet moves to the next field, and closes the keyboard after the last one
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#edSheet input:not([type="checkbox"]):not([type="radio"])')) {
    e.preventDefault();
    const inputs = [...document.querySelectorAll('#edSheet input:not([type="checkbox"]):not([type="radio"])')], i = inputs.indexOf(e.target);
    if (inputs[i + 1]) inputs[i + 1].focus(); else e.target.blur();
  }
});
// Swiping sideways moves through the flow: towards the reading direction goes forward, away goes back.
// Gestures that start on inputs or on things that scroll sideways themselves are left alone.
let stepSwipe = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { stepSwipe = null; return; }
  const skip = e.target.closest('input,textarea,select,#tapCard,.apple-box,#deck,.strip,.ftabs,.gal-row,.gal-filters,.chips,.modal,.editor,.hero-stage');
  stepSwipe = skip ? null : { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!stepSwipe) return;
  const p = e.changedTouches[0], dx = p.clientX - stepSwipe.x, dy = p.clientY - stepSwipe.y;
  stepSwipe = null;
  if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy) * 2) return;
  // the edit screen is all taps and sheets, so a sideways swipe there does nothing
  if (!$('#modal').hidden || state.step === 'welcome' || state.step === 'done' || state.step === 'edit') return;
  const f = dx * (document.documentElement.dir === 'rtl' ? 1 : -1);
  if (f < 0) back();
  else if (FLOW.includes(state.step) && state.step !== 'occasion') next();
});
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => { scheduleRender(); if (ui.sheet === 'design') renderThumbs(); });
}

/* ================= boot ================= */
draft = loadDraft();
if (CONFIG.english && draft && (draft.lang === 'ar' || draft.lang === 'en')) state.lang = draft.lang;
$('#brand').innerHTML = KN_ICON + `<span id="brandText">${wordmarkSVG('kn-acrylic-sm')}</span>`;
$('#brand').setAttribute('aria-label', CONFIG.brand.ar);
const tapId = new URLSearchParams(location.search).get('tap_id');
if (tapId && CONFIG.payUrl && draft) {
  // back from Tap's payment page: reopen the card on the pay step, then check the charge
  history.replaceState(null, '', location.pathname + location.hash);
  state = Object.assign(freshState(), draft); draft = null;
  state.step = 'pay';
} else if (draft && draft.paid && draft.orderNo && draft.step === 'done') {
  // a paid card stays paid after a reload
  state = Object.assign(freshState(), draft); draft = null;
}
renderScreen();
if (tapId && CONFIG.payUrl && state.step === 'pay') verifyReturn(tapId);
else if (tapId && CONFIG.payUrl) {
  history.replaceState(null, '', location.pathname + location.hash);
  payCall({ action: 'verify', id: tapId }).then(r => { if (r.paid) showPaidElsewhere(r.order); }).catch(() => {});
}
setupAsst();
AI.init().then(() => { if (location.hash === '#ai') openKeyBox(); });
window.addEventListener('hashchange', () => { if (location.hash === '#ai') openKeyBox(); });
initDownloads();
})();
</script>
